<!doctype html>
<html lang="am">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f59e0b">
  <title>Owner login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><span class="brand-badge">L3</span><span class="brand-title">የልደታ ወረዳ 3 ኢንስፔክሽን እና ስነምባር</span></a>
    </div>
  </header>
  <main>
    <div class="content" style="max-width:480px">
      <section class="forum-admin">
        <h2>Owner login</h2>
        <p class="forum-help">Only the site owner can add, edit, or delete information.</p>
        <form id="login-form" class="forum-form">
          <label>Username<input id="username" name="username" type="text" required autocomplete="username"></label>
          <label>Password<input id="password" name="password" type="password" required autocomplete="current-password"></label>
          <p id="login-error" class="forum-help" style="color:#b45309;display:none"></p>
          <button type="submit" class="forum-submit">Log in</button>
        </form>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("login-error");
      errorEl.style.display = "none";
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Login failed");
        location.href = "/admin";
      } catch (err) {
        errorEl.textContent = err.message === "Failed to fetch"
          ? "The website server is not running. Start it with npm start, then open http://localhost:3000/login."
          : err.message;
        errorEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
